<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buddy</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --bubble-user: #2b6cb0;
    --bubble-buddy: #262b36;
    --text: #e8eaed;
    --muted: #8a8f9c;
    --accent: #7dd3fc;
    --good: #4ade80;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 18px;
    background: var(--panel);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #262b36;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }
  .status-row {
    display: flex;
    gap: 14px;
    font-size: 12px;
    color: var(--muted);
  }
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 5px;
    background: var(--bad);
    vertical-align: middle;
  }
  .status-dot.ok { background: var(--good); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 14px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    border-bottom-right-radius: 4px;
  }
  .msg.buddy {
    align-self: flex-start;
    background: var(--bubble-buddy);
    border-bottom-left-radius: 4px;
  }
  .msg .emotion-tag {
    display: block;
    font-size: 11px;
    color: var(--accent);
    margin-top: 4px;
    text-transform: lowercase;
  }
  .msg.system {
    align-self: center;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
  }

  #inputRow {
    display: flex;
    gap: 8px;
    padding: 14px;
    background: var(--panel);
    border-top: 1px solid #262b36;
  }
  #textInput {
    flex: 1;
    padding: 12px 14px;
    border-radius: 20px;
    border: 1px solid #333a47;
    background: #1c2029;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  #textInput:focus { border-color: var(--accent); }

  button {
    border: none;
    border-radius: 20px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn {
    background: var(--accent);
    color: #0f1115;
  }
  #micBtn {
    background: #333a47;
    color: var(--text);
    min-width: 48px;
  }
  #micBtn.recording {
    background: var(--bad);
    color: white;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<header>
  <h1>🤖 Buddy</h1>
  <div class="status-row">
    <span><span id="ollamaDot" class="status-dot"></span>Ollama</span>
    <span><span id="esp32Dot" class="status-dot"></span>ESP32</span>
  </div>
</header>

<div id="chat"></div>

<div id="inputRow">
  <button id="micBtn" title="Record voice">🎤</button>
  <input id="textInput" type="text" placeholder="Type a message..." autocomplete="off">
  <button id="sendBtn">Send</button>
</div>

<script>
const chat = document.getElementById('chat');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const ollamaDot = document.getElementById('ollamaDot');
const esp32Dot = document.getElementById('esp32Dot');

function addMessage(text, kind, emotion) {
  const div = document.createElement('div');
  div.className = 'msg ' + kind;
  div.textContent = text;
  if (emotion) {
    const tag = document.createElement('span');
    tag.className = 'emotion-tag';
    tag.textContent = emotion;
    div.appendChild(tag);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  micBtn.disabled = busy;
  textInput.disabled = busy;
}

async function sendText() {
  const text = textInput.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  textInput.value = '';
  setBusy(true);
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await resp.json();
    if (data.reply) {
      addMessage(data.reply, 'buddy', data.emotion);
    } else {
      addMessage(data.error || 'Something went wrong.', 'system');
    }
  } catch (e) {
    addMessage('Could not reach the server.', 'system');
  }
  setBusy(false);
}

sendBtn.addEventListener('click', sendText);
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendText();
});

// ---- Voice recording ----
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

async function toggleRecording() {
  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = sendRecording;
      mediaRecorder.start();
      isRecording = true;
      micBtn.classList.add('recording');
      micBtn.textContent = '⏹';
      addMessage('Listening...', 'system');
    } catch (e) {
      addMessage('Microphone access denied or unavailable.', 'system');
    }
  } else {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
    isRecording = false;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
  }
}

async function sendRecording() {
  const blob = new Blob(audioChunks, { type: 'audio/webm' });
  const formData = new FormData();
  formData.append('audio', blob, 'recording.webm');

  setBusy(true);
  try {
    const resp = await fetch('/api/voice', { method: 'POST', body: formData });
    const data = await resp.json();
    if (data.user_text) {
      addMessage(data.user_text, 'user');
      addMessage(data.reply, 'buddy', data.emotion);
    } else {
      addMessage(data.error || 'Could not understand audio.', 'system');
    }
  } catch (e) {
    addMessage('Could not reach the server.', 'system');
  }
  setBusy(false);
}

micBtn.addEventListener('click', toggleRecording);

// ---- Status polling ----
async function pollStatus() {
  try {
    const resp = await fetch('/api/status');
    const data = await resp.json();
    ollamaDot.classList.toggle('ok', !!data.ollama);
    esp32Dot.classList.toggle('ok', !!data.esp32);
  } catch (e) {
    ollamaDot.classList.remove('ok');
    esp32Dot.classList.remove('ok');
  }
}
pollStatus();
setInterval(pollStatus, 5000);

addMessage('Say hi, or type a message to get started.', 'system');
</script>

</body>
</html>
