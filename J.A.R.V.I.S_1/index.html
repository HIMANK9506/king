<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070a;
    --panel: #0c1016;
    --panel-border: #1c2430;
    --gold: #f0a940;
    --gold-dim: #8a5f22;
    --gold-glow: rgba(240, 169, 64, 0.35);
    --cyan: #4fd8e0;
    --cyan-glow: rgba(79, 216, 224, 0.35);
    --text: #e9e6df;
    --text-muted: #7d8590;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(ellipse at 50% 0%, #0a0f16 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- ORB ---------- */
  .orb-stage {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 0 12px;
  }

  .orb-wrap {
    width: 150px;
    height: 150px;
    position: relative;
  }

  .orb-wrap svg { width: 100%; height: 100%; overflow: visible; }

  .orb-core {
    fill: var(--gold);
    filter: drop-shadow(0 0 12px var(--gold-glow));
    transition: fill 0.4s ease;
    animation: corepulse 3.2s ease-in-out infinite;
  }

  .orb-ring {
    fill: none;
    stroke: var(--gold-dim);
    stroke-width: 1.4;
    transition: stroke 0.4s ease;
  }

  .orb-arc {
    fill: none;
    stroke: var(--gold);
    stroke-width: 2;
    stroke-linecap: round;
    filter: drop-shadow(0 0 4px var(--gold-glow));
    transform-origin: 75px 75px;
    transition: stroke 0.4s ease;
    animation: spin 9s linear infinite;
  }
  .orb-arc.reverse { animation-direction: reverse; animation-duration: 13s; opacity: 0.6; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes corepulse {
    0%, 100% { opacity: 0.85; r: 16; }
    50% { opacity: 1; r: 19; }
  }

  /* state: listening -> cyan takes over, faster/tighter pulse */
  .orb-wrap.listening .orb-core { fill: var(--cyan); filter: drop-shadow(0 0 16px var(--cyan-glow)); animation-duration: 1.1s; }
  .orb-wrap.listening .orb-ring { stroke: var(--cyan); opacity: 0.7; }
  .orb-wrap.listening .orb-arc { stroke: var(--cyan); animation-duration: 2.4s; }
  .orb-wrap.listening .orb-arc.reverse { animation-duration: 3.4s; }

  /* state: thinking -> fast gold spin */
  .orb-wrap.thinking .orb-arc { animation-duration: 1.6s; }
  .orb-wrap.thinking .orb-arc.reverse { animation-duration: 2.2s; }
  .orb-wrap.thinking .orb-core { animation-duration: 0.9s; }

  /* state: speaking -> gold, rhythmic pulse */
  .orb-wrap.speaking .orb-core { animation-duration: 0.6s; }
  .orb-wrap.speaking .orb-ring { stroke: var(--gold); opacity: 0.9; }

  .status-label {
    margin-top: 16px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text-muted);
    transition: color 0.3s ease;
  }
  .status-label.listening { color: var(--cyan); }
  .status-label.thinking, .status-label.speaking { color: var(--gold); }

  /* ---------- CHAT ---------- */
  .chat-panel {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }

  .msg { display: flex; flex-direction: column; gap: 4px; max-width: 82%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.jarvis { align-self: flex-start; align-items: flex-start; }

  .msg-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .msg.jarvis .msg-label { color: var(--gold-dim); }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 14.5px;
    line-height: 1.5;
    border: 1px solid var(--panel-border);
    background: var(--panel);
  }
  .msg.user .msg-bubble { border-color: #2a2f38; }
  .msg.jarvis .msg-bubble { border-color: rgba(240, 169, 64, 0.25); }

  /* ---------- INPUT BAR ---------- */
  .input-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px 20px;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }

  .mic-btn {
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
  }
  .mic-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
  .mic-btn.active {
    border-color: var(--cyan);
    color: var(--cyan);
    box-shadow: 0 0 0 0 var(--cyan-glow);
    animation: mic-pulse 1.4s ease-out infinite;
  }
  @keyframes mic-pulse {
    0% { box-shadow: 0 0 0 0 var(--cyan-glow); }
    70% { box-shadow: 0 0 0 10px rgba(79, 216, 224, 0); }
    100% { box-shadow: 0 0 0 0 rgba(79, 216, 224, 0); }
  }

  #text-input {
    flex: 1 1 auto;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 11px 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s ease;
  }
  #text-input:focus { border-color: var(--gold-dim); }

  .send-btn {
    flex: 0 0 auto;
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--text-muted);
    border-radius: 4px;
    padding: 11px 16px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    letter-spacing: 1.5px;
    font-size: 13px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .send-btn:hover { border-color: var(--gold); color: var(--gold); }

  .chat-panel::-webkit-scrollbar { width: 6px; }
  .chat-panel::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }
</style>
</head>
<body>

<div class="orb-stage">
  <div class="orb-wrap" id="orb">
    <svg viewBox="0 0 150 150">
      <circle class="orb-ring" cx="75" cy="75" r="52" />
      <circle class="orb-ring" cx="75" cy="75" r="38" opacity="0.5" />
      <g class="orb-arc">
        <path d="M 75 23 A 52 52 0 0 1 127 75" />
      </g>
      <g class="orb-arc reverse">
        <path d="M 75 127 A 52 52 0 0 1 23 75" />
      </g>
      <circle class="orb-core" cx="75" cy="75" r="16" />
    </svg>
  </div>
  <div class="status-label" id="status">Standby</div>
</div>

<div class="chat-panel" id="chat"></div>

<div class="input-bar">
  <button class="mic-btn" id="micBtn" title="Toggle microphone">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
  </button>
  <input type="text" id="text-input" placeholder="Speak, or type a message..." autocomplete="off">
  <button class="send-btn" id="sendBtn">Send</button>
</div>

<script>
const orb = document.getElementById('orb');
const statusLabel = document.getElementById('status');
const chat = document.getElementById('chat');
const micBtn = document.getElementById('micBtn');
const textInput = document.getElementById('text-input');
const sendBtn = document.getElementById('sendBtn');

let jarvisVoice = null;
let idleTimer = null;
const IDLE_MS = 120000; // 2 minutes of no interaction triggers a proactive check-in

// ---------- state helpers ----------
function setState(state) {
  orb.className = 'orb-wrap' + (state !== 'standby' ? ' ' + state : '');
  statusLabel.className = 'status-label' + (state !== 'standby' ? ' ' + state : '');
  statusLabel.textContent = {
    standby: 'Standby',
    listening: 'Listening',
    thinking: 'Processing',
    speaking: 'Speaking'
  }[state] || 'Standby';
}

function addMessage(text, who) {
  const msg = document.createElement('div');
  msg.className = 'msg ' + who;
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = who === 'user' ? 'You' : 'Jarvis';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;
  msg.appendChild(label);
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function resetIdleTimer() {
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(triggerProactive, IDLE_MS);
}

// ---------- TTS ----------
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  const preferred = voices.find(v => /male|david|guy|daniel/i.test(v.name) && v.lang.startsWith('en'));
  jarvisVoice = preferred || voices.find(v => v.lang.startsWith('en')) || voices[0] || null;
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  if (jarvisVoice) utter.voice = jarvisVoice;
  utter.rate = 1.0;
  utter.pitch = 0.95;
  utter.onstart = () => setState('speaking');
  utter.onend = () => setState('standby');
  speechSynthesis.speak(utter);
}

// ---------- backend calls ----------
async function sendToJarvis(text) {
  addMessage(text, 'user');
  setState('thinking');
  resetIdleTimer();
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    if (data.error) {
      addMessage('Apologies, I encountered an error: ' + data.error, 'jarvis');
      setState('standby');
      return;
    }
    addMessage(data.reply, 'jarvis');
    speak(data.reply);
  } catch (err) {
    addMessage('I was unable to reach the server. Please check that app.py is running.', 'jarvis');
    setState('standby');
  }
}

async function triggerProactive() {
  setState('thinking');
  try {
    const res = await fetch('/proactive', { method: 'POST' });
    const data = await res.json();
    if (!data.error) {
      addMessage(data.reply, 'jarvis');
      speak(data.reply);
    } else {
      setState('standby');
    }
  } catch (err) {
    setState('standby');
  }
  resetIdleTimer();
}

// ---------- text input ----------
sendBtn.addEventListener('click', () => {
  const text = textInput.value.trim();
  if (!text) return;
  textInput.value = '';
  sendToJarvis(text);
});
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendBtn.click();
});
textInput.addEventListener('input', resetIdleTimer);

// ---------- speech recognition (mic) ----------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;
let heardSomething = false;
let silenceTimeout = null;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onstart = () => {
    listening = true;
    heardSomething = false;
    micBtn.classList.add('active');
    setState('listening');
    // if nothing heard within 6s, tell the user we can't hear them
    silenceTimeout = setTimeout(() => {
      if (!heardSomething && listening) {
        recognition.stop();
      }
    }, 6000);
  };

  recognition.onresult = (event) => {
    heardSomething = true;
    const transcript = event.results[event.results.length - 1][0].transcript;
    if (event.results[event.results.length - 1].isFinal) {
      sendToJarvis(transcript.trim());
    }
  };

  recognition.onerror = (event) => {
    if (event.error === 'no-speech') {
      heardSomething = false;
    }
  };

  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('active');
    clearTimeout(silenceTimeout);
    if (!heardSomething) {
      addMessage("I can't hear you, sir.", 'jarvis');
      speak("I can't hear you, sir.");
    } else {
      setState('standby');
    }
    resetIdleTimer();
  };

  micBtn.addEventListener('click', () => {
    if (listening) {
      recognition.stop();
    } else {
      recognition.start();
    }
  });
} else {
  micBtn.addEventListener('click', () => {
    addMessage('Voice input is not supported in this browser. Please use Chrome or Edge.', 'jarvis');
  });
}

// ---------- boot ----------
setState('standby');
resetIdleTimer();
addMessage('Good day, sir. I am online and ready when you are.', 'jarvis');
</script>

</body>
</html>
