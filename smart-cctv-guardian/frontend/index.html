<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shield.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="AI Smart CCTV Intruder Detection & Threat Response System" />

    <!-- Mobile PWA Support (Android & iOS) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CCTV Guardian" />
    <link rel="apple-touch-icon" href="/shield.svg" />

    <link rel="manifest" href="/manifest.json" />
    <title>Smart CCTV Guardian</title>
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-red-500 selection:text-white overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('Service Worker registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
