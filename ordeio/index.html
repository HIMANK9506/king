<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070a; --sidebar: #0a0d12; --panel: #0c1016; --panel-border: #1c2430;
    --gold: #f0a940; --gold-dim: #8a5f22; --gold-glow: rgba(240, 169, 64, 0.35);
    --cyan: #4fd8e0; --cyan-glow: rgba(79, 216, 224, 0.35);
    --text: #e9e6df; --text-muted: #7d8590;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; display: flex; overflow: hidden; }

  .sidebar { width: 240px; flex: 0 0 auto; background: var(--sidebar); border-right: 1px solid var(--panel-border); display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
  .brand { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 4px; color: var(--gold); }
  .orb-wrap { width: 90px; height: 90px; margin-top: 24px; position: relative; }
  .orb-wrap svg { width: 100%; height: 100%; overflow: visible; }
  .orb-core { fill: var(--gold); filter: drop-shadow(0 0 10px var(--gold-glow)); animation: corepulse 3.2s ease-in-out infinite; transition: fill 0.4s ease; }
  .orb-ring { fill: none; stroke: var(--gold-dim); stroke-width: 1.4; transition: stroke 0.4s ease; }
  .orb-arc { fill: none; stroke: var(--gold); stroke-width: 2; stroke-linecap: round; filter: drop-shadow(0 0 4px var(--gold-glow)); transform-origin: 75px 75px; animation: spin 8s linear infinite; transition: stroke 0.4s ease; }
  .orb-arc.reverse { animation-direction: reverse; animation-duration: 11s; opacity: 0.6; }
  .orb-spark { fill: var(--cyan); opacity: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes corepulse { 0%,100% { opacity: .85; r:16; } 50% { opacity:1; r:19; } }
  .orb-wrap.listening .orb-core { fill: var(--cyan); filter: drop-shadow(0 0 14px var(--cyan-glow)); animation-duration: 0.9s; }
  .orb-wrap.listening .orb-ring { stroke: var(--cyan); opacity: .75; }
  .orb-wrap.listening .orb-arc { stroke: var(--cyan); animation-duration: 1.8s; }
  .orb-wrap.listening .orb-arc.reverse { animation-duration: 2.6s; }
  .orb-wrap.thinking .orb-arc { animation-duration: 1s; }
  .orb-wrap.thinking .orb-arc.reverse { animation-duration: 1.4s; }
  .orb-wrap.thinking .orb-core { animation-duration: 0.5s; }
  .orb-wrap.thinking .orb-spark { animation: sparkburst 1.1s ease-in-out infinite; }
  .orb-wrap.speaking .orb-core { animation-duration: 0.35s; }
  .orb-wrap.speaking .orb-ring { stroke: var(--gold); opacity: .95; }
  .orb-wrap.speaking .orb-arc { animation-duration: 4s; stroke-width: 2.6; }
  @keyframes sparkburst { 0%,100% { opacity: 0; r: 1.5; } 50% { opacity: 1; r: 3; } }

  .status-label { margin-top: 14px; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); transition: color 0.3s ease; }
  .status-label.listening { color: var(--cyan); }
  .status-label.thinking, .status-label.speaking { color: var(--gold); }

  .mode-toggle { margin-top: 28px; width: 100%; display: flex; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 6px; overflow: hidden; }
  .mode-toggle button { flex: 1; background: transparent; border: none; color: var(--text-muted); font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; padding: 9px 0; cursor: pointer; transition: all 0.2s ease; }
  .mode-toggle button.active { background: var(--gold-dim); color: #12100a; }

  .new-chat-btn { margin-top: 12px; width: 100%; background: transparent; border: 1px solid var(--panel-border); color: var(--text-muted); border-radius: 6px; padding: 9px 0; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; transition: all 0.2s ease; }
  .new-chat-btn:hover { border-color: var(--gold-dim); color: var(--gold); }

  .sidebar-hint { margin-top: auto; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); line-height: 1.6; opacity: 0.6; }

  .main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  .chat-panel { flex: 1 1 auto; overflow-y: auto; padding: 24px 0 20px; }
  .chat-inner { max-width: 720px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 2px; }
  .msg-row { display: flex; flex-direction: column; gap: 6px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .msg-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }
  .msg-row.ordio .msg-label { color: var(--gold-dim); }
  .msg-text { font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; }
  .msg-image { max-width: 260px; border-radius: 6px; border: 1px solid var(--panel-border); margin-top: 4px; }

  .code-block { background: #080a0d; border: 1px solid var(--panel-border); border-radius: 6px; margin: 8px 0; overflow: hidden; }
  .code-block pre { padding: 12px 14px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #d8dee9; }
  .code-block-bar { display: flex; justify-content: flex-end; padding: 6px 10px; border-top: 1px solid var(--panel-border); gap: 8px; }
  .run-btn { background: transparent; border: 1px solid var(--gold-dim); color: var(--gold); font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
  .run-btn:hover { background: var(--gold-dim); color: #12100a; }
  .run-output { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; padding: 10px 14px; border-top: 1px solid var(--panel-border); white-space: pre-wrap; color: var(--cyan); }
  .run-output.error { color: #ff8484; }

  .input-area { flex: 0 0 auto; padding: 14px 24px 20px; }
  .input-inner { max-width: 720px; margin: 0 auto; }
  .attach-preview { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); }
  .attach-preview img { height: 36px; border-radius: 4px; border: 1px solid var(--panel-border); }
  .attach-preview button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px; }
  .input-bar { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 8px 8px 8px 14px; }
  .input-bar:focus-within { border-color: var(--gold-dim); }
  #text-input { flex: 1 1 auto; background: transparent; border: none; color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; outline: none; }
  .icon-btn { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; border: none; background: transparent; color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; }
  .icon-btn:hover { color: var(--gold); }
  .icon-btn.mic-btn.active { color: var(--cyan); animation: mic-pulse 1.4s ease-out infinite; }
  @keyframes mic-pulse { 0% { box-shadow: 0 0 0 0 var(--cyan-glow); } 70% { box-shadow: 0 0 0 9px rgba(79,216,224,0); } 100% { box-shadow: 0 0 0 0 rgba(79,216,224,0); } }
  .send-btn { flex: 0 0 auto; background: var(--gold-dim); border: none; color: #12100a; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .hint-row { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--text-muted); margin-top: 8px; opacity: 0.6; }
  .chat-panel::-webkit-scrollbar { width: 6px; }
  .chat-panel::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="brand">ORDIO</div>
  <div class="orb-wrap" id="orb">
    <svg viewBox="0 0 150 150">
      <circle class="orb-ring" cx="75" cy="75" r="52" />
      <circle class="orb-ring" cx="75" cy="75" r="38" opacity="0.5" />
      <g class="orb-arc"><path d="M 75 23 A 52 52 0 0 1 127 75" /></g>
      <g class="orb-arc reverse"><path d="M 75 127 A 52 52 0 0 1 23 75" /></g>
      <circle class="orb-spark" cx="105" cy="45" r="2" />
      <circle class="orb-spark" cx="45" cy="105" r="2" style="animation-delay: 0.3s" />
      <circle class="orb-core" cx="75" cy="75" r="16" />
    </svg>
  </div>
  <div class="status-label" id="status">Standby</div>

  <div class="mode-toggle">
    <button id="modeOnline" class="active">Online</button>
    <button id="modeOffline">Offline</button>
  </div>
  <button class="new-chat-btn" id="newChatBtn">New Chat</button>

  <div class="sidebar-hint">
    /image &lt;prompt&gt; to generate an image<br>
    Attach a screenshot to ask about it<br>
    Speak or type anytime to interrupt<br>
    Mic needs Chrome (not Brave)
  </div>
</div>

<div class="main">
  <div class="chat-panel" id="chatPanel"><div class="chat-inner" id="chat"></div></div>

  <div class="input-area">
    <div class="input-inner">
      <div class="attach-preview" id="attachPreview" style="display:none;">
        <img id="attachThumb" src="" alt="attached image">
        <span>Image attached</span>
        <button id="attachRemove">&times;</button>
      </div>
      <div class="input-bar">
        <button class="icon-btn" id="attachBtn" title="Attach image">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="imageInput" accept="image/*" style="display:none;">
        <input type="text" id="text-input" placeholder="Speak, or type a message..." autocomplete="off">
        <button class="icon-btn mic-btn" id="micBtn" title="Toggle microphone">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <button class="send-btn" id="sendBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="hint-row">ORDIO can make mistakes. Verify anything important.</div>
    </div>
  </div>
</div>

<script>
const orb = document.getElementById('orb');
const statusLabel = document.getElementById('status');
const chat = document.getElementById('chat');
const chatPanel = document.getElementById('chatPanel');
const micBtn = document.getElementById('micBtn');
const textInput = document.getElementById('text-input');
const sendBtn = document.getElementById('sendBtn');
const attachBtn = document.getElementById('attachBtn');
const imageInput = document.getElementById('imageInput');
const attachPreview = document.getElementById('attachPreview');
const attachThumb = document.getElementById('attachThumb');
const attachRemove = document.getElementById('attachRemove');
const modeOnlineBtn = document.getElementById('modeOnline');
const modeOfflineBtn = document.getElementById('modeOffline');
const newChatBtn = document.getElementById('newChatBtn');

let idleTimer = null;
const IDLE_MS = 120000;
let pendingImage = null;

function setState(s) {
  orb.className = 'orb-wrap' + (s !== 'standby' ? ' ' + s : '');
  statusLabel.className = 'status-label' + (s !== 'standby' ? ' ' + s : '');
  statusLabel.textContent = { standby: 'Standby', listening: 'Listening', thinking: 'Processing', speaking: 'Speaking' }[s] || 'Standby';
}
function resetIdleTimer() { if (idleTimer) clearTimeout(idleTimer); idleTimer = setTimeout(triggerProactive, IDLE_MS); }

// ---------- rendering ----------
function renderMessageContent(text, container) {
  const parts = text.split(/```(\w*)\n?([\s\S]*?)```/g);
  for (let i = 0; i < parts.length; i += 3) {
    const plain = parts[i];
    if (plain && plain.trim()) {
      const p = document.createElement('div');
      p.className = 'msg-text';
      p.textContent = plain.trim();
      container.appendChild(p);
    }
    const code = parts[i + 2];
    if (code !== undefined) {
      const block = document.createElement('div');
      block.className = 'code-block';
      const pre = document.createElement('pre');
      const codeEl = document.createElement('code');
      codeEl.textContent = code.trim();
      pre.appendChild(codeEl);
      const bar = document.createElement('div');
      bar.className = 'code-block-bar';
      const runBtn = document.createElement('button');
      runBtn.className = 'run-btn';
      runBtn.textContent = 'Run';
      const outputDiv = document.createElement('div');
      outputDiv.style.display = 'none';
      outputDiv.className = 'run-output';
      runBtn.addEventListener('click', async () => {
        runBtn.textContent = 'Running...';
        try {
          const res = await fetch('/run_code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code.trim() }) });
          const data = await res.json();
          outputDiv.style.display = 'block';
          if (data.error) { outputDiv.textContent = data.error; outputDiv.classList.add('error'); }
          else { outputDiv.textContent = data.output || '(no output)'; outputDiv.classList.remove('error'); }
        } catch (err) {
          outputDiv.style.display = 'block';
          outputDiv.textContent = 'Could not reach the server to run this code.';
          outputDiv.classList.add('error');
        }
        runBtn.textContent = 'Run';
      });
      bar.appendChild(runBtn);
      block.appendChild(pre); block.appendChild(bar); block.appendChild(outputDiv);
      container.appendChild(block);
    }
  }
}

function addMessage(text, who, imageUrl) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + who;
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = who === 'user' ? 'You' : 'Ordio';
  row.appendChild(label);
  if (imageUrl) { const img = document.createElement('img'); img.className = 'msg-image'; img.src = imageUrl; row.appendChild(img); }
  if (text) renderMessageContent(text, row);
  chat.appendChild(row);
  chatPanel.scrollTop = chatPanel.scrollHeight;
  return row;
}

function addGeneratedImage(base64) {
  const row = document.createElement('div');
  row.className = 'msg-row ordio';
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = 'Ordio';
  const img = document.createElement('img');
  img.className = 'msg-image';
  img.src = 'data:image/png;base64,' + base64;
  row.appendChild(label); row.appendChild(img);
  chat.appendChild(row);
  chatPanel.scrollTop = chatPanel.scrollHeight;
}

// ---------- TTS queue (sentence-by-sentence, low latency) ----------
const audioPlayer = new Audio();
let ttsQueue = [];
let ttsPlaying = false;
let ttsAbortFlag = false;

function clearSpeechQueue() {
  ttsQueue = [];
  ttsAbortFlag = true;
  audioPlayer.pause();
  audioPlayer.currentTime = 0;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

function enqueueSpeech(text) {
  const t = text.trim();
  if (!t) return;
  ttsQueue.push(t);
  processQueue();
}

async function processQueue() {
  if (ttsPlaying || ttsQueue.length === 0) return;
  ttsPlaying = true;
  ttsAbortFlag = false;
  const text = ttsQueue.shift();
  await speakOnce(text);
  ttsPlaying = false;
  if (!ttsAbortFlag) processQueue();
  else if (ttsQueue.length === 0) setState('standby');
}

function speakOnce(text) {
  return new Promise(async (resolve) => {
    try {
      const res = await fetch('/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
      if (ttsAbortFlag) return resolve();
      if (!res.ok) throw new Error('tts failed');
      const blob = await res.blob();
      if (ttsAbortFlag) return resolve();
      const url = URL.createObjectURL(blob);
      audioPlayer.src = url;
      audioPlayer.onplay = () => setState('speaking');
      audioPlayer.onended = () => { URL.revokeObjectURL(url); resolve(); };
      audioPlayer.onerror = () => resolve();
      await audioPlayer.play();
    } catch (err) {
      resolve();
    }
  });
}

// ---------- backend calls (streaming) ----------
let currentChatController = null;

function stopOrdio() {
  if (currentChatController) { currentChatController.abort(); currentChatController = null; }
  clearSpeechQueue();
}

async function sendToJarvis(text) {
  stopOrdio();
  const imageToSend = pendingImage;
  addMessage(text, 'user', imageToSend);
  clearAttachment();
  setState('thinking');
  resetIdleTimer();

  const row = addMessage('', 'ordio');
  const liveTextEl = document.createElement('div');
  liveTextEl.className = 'msg-text';
  row.appendChild(liveTextEl);

  currentChatController = new AbortController();
  let buffer = '';
  let sentenceBuffer = '';
  let firstChunk = true;

  try {
    const res = await fetch('/chat_stream', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, image: imageToSend }),
      signal: currentChatController.signal
    });
    if (!res.ok || !res.body) throw new Error('stream failed');

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      const chunkText = decoder.decode(value, { stream: true });
      if (firstChunk) { firstChunk = false; }
      buffer += chunkText;
      sentenceBuffer += chunkText;
      liveTextEl.textContent = buffer;
      chatPanel.scrollTop = chatPanel.scrollHeight;

      let match = sentenceBuffer.match(/^([\s\S]*?[.!?])(\s+|$)/);
      while (match) {
        enqueueSpeech(match[1]);
        sentenceBuffer = sentenceBuffer.slice(match[0].length);
        match = sentenceBuffer.match(/^([\s\S]*?[.!?])(\s+|$)/);
      }
    }
    if (sentenceBuffer.trim()) enqueueSpeech(sentenceBuffer);

    if (buffer.includes('[[ORDIO_ERROR]]')) {
      const errMsg = buffer.split('[[ORDIO_ERROR]]')[1] || 'Unknown error';
      liveTextEl.textContent = 'Apologies, I encountered an error: ' + errMsg;
    } else {
      // re-render with proper code block formatting now that streaming is done
      row.innerHTML = '';
      const label = document.createElement('div');
      label.className = 'msg-label';
      label.textContent = 'Ordio';
      row.appendChild(label);
      renderMessageContent(buffer, row);
    }
  } catch (err) {
    if (err.name === 'AbortError') return;
    liveTextEl.textContent = 'I was unable to reach the server. Please check that app.py is running.';
    setState('standby');
  }
}

async function generateImage(prompt) {
  addMessage('/image ' + prompt, 'user');
  setState('thinking');
  try {
    const res = await fetch('/generate_image', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
    const data = await res.json();
    if (data.error) addMessage('I was unable to generate that image: ' + data.error, 'ordio');
    else addGeneratedImage(data.image);
  } catch (err) { addMessage('I was unable to reach the image generation service.', 'ordio'); }
  setState('standby');
}

async function triggerProactive() {
  setState('thinking');
  try {
    const res = await fetch('/proactive', { method: 'POST' });
    const data = await res.json();
    if (!data.error) { addMessage(data.reply, 'ordio'); enqueueSpeech(data.reply); }
    else setState('standby');
  } catch (err) { setState('standby'); }
  resetIdleTimer();
}

// ---------- attachment ----------
attachBtn.addEventListener('click', () => imageInput.click());
imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => { pendingImage = e.target.result; attachThumb.src = pendingImage; attachPreview.style.display = 'flex'; };
  reader.readAsDataURL(file);
});
function clearAttachment() { pendingImage = null; imageInput.value = ''; attachPreview.style.display = 'none'; }
attachRemove.addEventListener('click', clearAttachment);

// ---------- mode toggle ----------
async function setMode(mode) {
  modeOnlineBtn.classList.toggle('active', mode === 'online');
  modeOfflineBtn.classList.toggle('active', mode === 'offline');
  try { await fetch('/mode', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode }) }); } catch (err) {}
}
modeOnlineBtn.addEventListener('click', () => setMode('online'));
modeOfflineBtn.addEventListener('click', () => setMode('offline'));

// ---------- new chat ----------
newChatBtn.addEventListener('click', () => {
  stopOrdio();
  chat.innerHTML = '';
  clearAttachment();
  addMessage('New session started. What can I help you with?', 'ordio');
});

// ---------- text input ----------
function handleSend() {
  const text = textInput.value.trim();
  if (!text && !pendingImage) return;
  textInput.value = '';
  if (text.startsWith('/image ')) generateImage(text.slice(7).trim());
  else sendToJarvis(text);
}
sendBtn.addEventListener('click', handleSend);
textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });
textInput.addEventListener('input', resetIdleTimer);

// ---------- speech recognition with real error diagnostics ----------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, listening = false, heardSomething = false, silenceTimeout = null;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onstart = () => {
    stopOrdio();
    listening = true; heardSomething = false;
    micBtn.classList.add('active');
    setState('listening');
    silenceTimeout = setTimeout(() => { if (!heardSomething && listening) recognition.stop(); }, 6000);
  };
  recognition.onresult = (event) => {
    heardSomething = true;
    const transcript = event.results[event.results.length - 1][0].transcript;
    if (event.results[event.results.length - 1].isFinal) sendToJarvis(transcript.trim());
  };
  recognition.onerror = (event) => {
    if (event.error === 'no-speech') { heardSomething = false; return; }
    heardSomething = true; // suppress the generic "can't hear you" message, we have a real error
    let msg = 'Microphone error (' + event.error + ').';
    if (event.error === 'network') {
      msg += ' This is almost always Brave Shields blocking the speech recognition service. Try Chrome instead, or turn Shields off for this page.';
    } else if (event.error === 'not-allowed' || event.error === 'permission-denied') {
      msg += ' Microphone permission is blocked - check the site settings icon in the address bar.';
    } else if (event.error === 'audio-capture') {
      msg += ' No microphone was detected on this device.';
    }
    addMessage(msg, 'ordio');
  };
  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('active');
    clearTimeout(silenceTimeout);
    if (!heardSomething) { addMessage("I can't hear you, sir.", 'ordio'); enqueueSpeech("I can't hear you, sir."); }
    else setState('standby');
    resetIdleTimer();
  };

  micBtn.addEventListener('click', async () => {
    if (listening) { recognition.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(t => t.stop()); // just confirming access, recognition opens its own stream
    } catch (err) {
      addMessage('I could not access the microphone: ' + err.message + '. Check your browser\'s site permissions for this page.', 'ordio');
      return;
    }
    recognition.start();
  });
} else {
  micBtn.addEventListener('click', () => addMessage('Voice input is not supported in this browser. Please use Chrome.', 'ordio'));
}

// ---------- boot ----------
setState('standby');
resetIdleTimer();
addMessage('Good day, sir. I am online and ready when you are.', 'ordio');
</script>

</body>
</html>
